[project]
name = "ptit-insights-pipeline"
version = "1.0.0"
description = "Data pipeline for PTIT Academic Insights: raw xlsx -> validated -> cleaned -> metrics -> anonymized JSON for the static site."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "openpyxl>=3.1",
  "jsonschema>=4.23",
  "pyarrow>=17",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
